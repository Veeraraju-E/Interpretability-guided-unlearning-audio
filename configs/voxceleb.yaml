experiment:
  name: voxceleb_exp
  save_dir: ./runs/voxceleb
  device: cuda
  seed: 1337

dataset:
  name: voxceleb
  root_or_manifest: /data/veer/testing/new/datasets/voxceleb2/manifest.csv
  dev_frac: 0.7
  forget_labels: ['id00017']

encoder:
  name: ecapa
  wav2vec2_model: facebook/wav2vec2-base
  hubert_model: facebook/hubert-base-ls960
  conformer_model: facebook/wav2vec2-conformer-rel-pos-large
  embeddings_path: null

sae:
  variant: topk
  multiplier: 8.0
  topk: 128
  lambda_sparsity: 0.0
  epochs: 350
  batch_size: 64
  hidden_dim: 0

feature_mining:
  build_U_top: 153 # 10% of 1536 (192*8)
  statistical_method: cohens_d  # Only cohens_d supported

edits:
  beta: 0.0
  leace: true
  leace_ridge: 1e-6
  noise_sigma: 0.02

orchestration:
  mode: single
  seeds: [1337]
  classifier_epochs: 20

visual_abstract:
  overlay_xlim: [-12, 4]
  overlay_ylim: [-6, 6]
  enabled: true
  max_points: 1500
  k_plot: 5
  overlay_top_n: 5     # how many SAE directions to overlay on projected panel
  hist_top_n: 5        # how many SAE features to histogram (forget vs retain)

cka_classical:
  enabled: true   # set true to run CKA (SAE latents vs classical audio features) when real audio paths in manifest
