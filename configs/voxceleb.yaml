experiment:
  name: voxceleb_exp
  save_dir: ./runs/voxceleb2
  device: cuda
  seed: 1337

dataset:
  name: voxceleb
  root_or_manifest: /data/veer/testing/new/datasets/voxceleb2/manifest.csv
  dev_frac: 0.7
  forget_labels: ['id00017']

encoder:
  name: ecapa
  wav2vec2_model: facebook/wav2vec2-base
  hubert_model: facebook/hubert-base-ls960
  conformer_model: facebook/wav2vec2-conformer-rel-pos-large
  embeddings_path: null

sae:
  variant: topk
  multiplier: 10.0
  topk: 128
  lambda_sparsity: 0.0
  epochs: 100
  batch_size: 64
  hidden_dim: 0

feature_mining:
  build_U_top: 200

edits:
  beta: 0.0
  leace: true
  leace_ridge: 1e-6
  noise_sigma: 0.02

orchestration:
  mode: single
  seeds: [1337, 1338, 1339]
  classifier_epochs: 20