experiment:
  name: lahaja_exp
  save_dir: ./runs/lahaja
  device: cuda
  seed: 1337

dataset:
  name: lahaja
  root_or_manifest: test  # HF split: train|validation|test
  dev_frac: 0.7
  forget_labels: ['6012000339299']
encoder:
  name: wav2vec2
  wav2vec2_model: theainerd/Wav2Vec2-large-xlsr-hindi
  hubert_model: facebook/hubert-base-ls960
  conformer_model: facebook/wav2vec2-conformer-rel-pos-large
  embeddings_path: null

sae:
  variant: topk
  multiplier: 10.0
  topk: 128
  lambda_sparsity: 0.0
  epochs: 100
  batch_size: 64
  hidden_dim: 0

feature_mining:
  build_U_top: 3840
  statistical_method: cohens_d  # Only cohens_d supported

edits:
  beta: 0.0
  leace: true
  leace_ridge: 1e-6
  noise_sigma: 0.02

orchestration:
  mode: single
  seeds: [1337, 1338, 1339]
  classifier_epochs: 20