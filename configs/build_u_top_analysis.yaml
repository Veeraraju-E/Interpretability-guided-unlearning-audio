experiment:
  name: build_u_top_analysis
  save_dir: ./runs/build_u_top_analysis/audiomnist
  device: cuda
  seed: 1337

dataset:
  name: audiomnist
  root_or_manifest: /data/veer/testing/new/datasets/audiomnist_data
  dev_frac: 0.7
  forget_labels: ['1']  # Single forget label for focused analysis

encoder:
  name: ecapa  # Will be overridden in analysis script
  wav2vec2_model: facebook/wav2vec2-base
  hubert_model: facebook/hubert-base-ls960
  conformer_model: facebook/wav2vec2-conformer-rel-pos-large
  embeddings_path: null

sae:
  variant: topk
  multiplier: 8.0  # Fixed multiplier for consistent SAE latent dimensions
  topk: 128
  lambda_sparsity: 0.0
  epochs: 1  # Reduced for faster analysis
  batch_size: 64
  hidden_dim: 0

feature_mining:
  build_U_top: 15  # Will be overridden in analysis script (1% of ECAPA SAE latent dim)
  statistical_method: cohens_d  # Only cohens_d supported

edits:
  beta: 0.0
  leace: true
  leace_ridge: 1e-6
  noise_sigma: 0.02

orchestration:
  mode: single
  seeds: [1337]  # Single seed for focused analysis
  classifier_epochs: 20
