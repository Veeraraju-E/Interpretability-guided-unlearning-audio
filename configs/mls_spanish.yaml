experiment:
  name: mls_spanish_exp
  save_dir: ./runs/mls_spanish
  device: cuda
  seed: 1337

dataset:
  name: mls_spanish
  root_or_manifest: /data/veer/testing/new/datasets/mls_spanish/dev/audio
  dev_frac: 0.7
  forget_labels: ['2592']

encoder:
  name: wav2vec2
  wav2vec2_model: facebook/wav2vec2-large-xlsr-53-spanish
  hubert_model: facebook/hubert-base-ls960
  conformer_model: facebook/wav2vec2-conformer-rel-pos-large
  embeddings_path: null

sae:
  enabled: true
  variant: topk
  multiplier: 10.0
  topk: 128
  lambda_sparsity: 0.0
  epochs: 100
  batch_size: 64
  hidden_dim: 0
  
feature_mining:
  build_U_top: 1536
  fdr: 1
  statistical_method: cohens_d  # Only cohens_d supported

edits:
  beta: 0.0
  leace: true
  leace_ridge: 1e-6
  noise_sigma: 0.02

orchestration:
  mode: single
  seeds: [1337]
  classifier_epochs: 20